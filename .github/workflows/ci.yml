name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudguardian
          POSTGRES_PASSWORD: cloudguardian_dev_123
          POSTGRES_DB: cloudguardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudguardian"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://cloudguardian:cloudguardian_dev_123@localhost:5432/cloudguardian_test?sslmode=disable
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database schema
        run: npx prisma db push

      - name: Integration tests (todas as rotas contra Postgres real)
        run: npx vitest run tests/integration
