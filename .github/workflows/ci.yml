name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build
