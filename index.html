
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudGuardian Console</title>
    <script>
      // Polyfill para evitar "process is not defined" no navegador
      window.process = {
        env: {
          API_KEY: '',
          NODE_ENV: 'development'
        }
      };
    </script>
    <!-- Tailwind agora é compilado via PostCSS/Vite (ver index.css e
         tailwind.config.js) — sem dependência do CDN em runtime. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
