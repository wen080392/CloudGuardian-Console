
<!DOCTYPE html>
<!-- translate="no" + notranslate: extensões de tradução do navegador (ex.:
     Google Translate) reescrevem nós de texto e quebram a reconciliação do
     React ("Failed to execute 'insertBefore'...") ao re-renderizar áreas
     densas de texto, como o editor de Terraform. lang=pt-BR reduz a oferta
     automática de tradução (o conteúdo é majoritariamente português). -->
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>CloudGuardian Console</title>
    <script>
      // Polyfill para evitar "process is not defined" no navegador
      window.process = {
        env: {
          API_KEY: '',
          NODE_ENV: 'development'
        }
      };
    </script>
    <!-- Tailwind agora é compilado via PostCSS/Vite (ver index.css e
         tailwind.config.js) — sem dependência do CDN em runtime. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
