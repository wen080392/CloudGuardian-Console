# Desenvolvimento: builda a imagem a partir do código local.
# Para produção (imagem publicada no GHCR), use docker-compose.prod.yml.
#
#   cp .env.docker .env            (Windows: Copy-Item .env.docker .env -Force)
#   docker compose up -d --build   # sobe app + Postgres + Redis
#   docker compose run --rm migrate  # cria as tabelas (1x, antes do 1º uso)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudguardian
      POSTGRES_USER: cloudguardian
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudguardian_dev_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Cria/atualiza as tabelas no Postgres. Roda 1x e sai:
  #   docker compose run --rm migrate
  # O app NÃO migra no boot (evita corrida entre réplicas).
  migrate:
    build: .
    env_file: .env
    entrypoint: ["npx", "prisma", "db", "push"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
